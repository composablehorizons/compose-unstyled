# Shared Android emulator profile for local development and CI.
avdName=Unstyled_Tests
apiLevel=23
target=default
arch.default=x86_64
arch.appleSilicon=arm64-v8a
diskSize=2048M
displayWidth=320
displayHeight=640
displayDensity=160
cpuCores=2
hardwareProfile=none
launchFlags=-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
