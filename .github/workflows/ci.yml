name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      library: ${{ steps.select.outputs.library }}
      website: ${{ steps.select.outputs.website }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test check selection
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select checks from changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 -B .github/scripts/select_pr_checks.py >> "$GITHUB_OUTPUT"

  website-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Build interactive demos
        run: ./gradlew :demo:wasmJsBrowserDistribution
      - name: Build and verify website
        working-directory: website
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build

  discover-android-modules:
    needs: detect-changes
    if: needs.detect-changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    outputs:
      android_modules: ${{ steps.discover.outputs.android_modules }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Discover Android modules
        id: discover
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          test_modules="$(
            ./gradlew --console=plain tasks --all |
              awk -F: '/^composeunstyled-[^:]+:connectedDebugAndroidTest / { print ":" $1 }' |
              sort -u
          )"

          android_modules=""
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$PR_HEAD_REF" != "changeset-release/main" ]; then
            merge_base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
            changed_files="$(git diff --name-only "$merge_base" "${{ github.event.pull_request.head.sha }}")"
            android_changed_modules="$(
              printf '%s\n' "$changed_files" |
                awk -F/ '$2 == "src" && ($3 == "commonMain" || $3 == "commonTest" || $3 == "androidMain" || $3 == "androidInstrumentedTest") { print ":" $1 }' |
                sort -u
            )"

            android_modules="$(
              comm -12 \
                <(printf '%s\n' "$test_modules" | sort -u) \
                <(printf '%s\n' "$android_changed_modules" | sort -u)
            )"
          else
            android_modules="$test_modules"
          fi

          if [ -z "$android_modules" ]; then
            echo "android_modules=[]" >> "$GITHUB_OUTPUT"
          else
            android_modules_json="$(printf '%s\n' "$android_modules" | jq -R . | jq -s -c .)"
            echo "android_modules=$android_modules_json" >> "$GITHUB_OUTPUT"
          fi

  fast-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          token: ${{ github.token }}

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Fast Checks
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          test_modules="$(
            find . \( -path './*/src/commonTest' -o -path './*/src/jvmTest' -o -path './*/src/desktopTest' -o -path './*/src/androidInstrumentedTest' \) -type d |
              awk -F/ '{ print ":" $2 }' |
              sort -u
          )"

          changed_modules=""
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$PR_HEAD_REF" != "changeset-release/main" ]; then
            merge_base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
            changed_files="$(git diff --name-only "$merge_base" "${{ github.event.pull_request.head.sha }}")"

            while IFS= read -r file; do
              module="${file%%/*}"
              if [ "$module" != "$file" ] && [ -f "$module/build.gradle.kts" ]; then
                printf ':%s\n' "$module"
              fi
            done <<< "$changed_files" > /tmp/changed-modules.txt
            changed_modules="$(sort -u /tmp/changed-modules.txt)"
          else
            changed_modules="$test_modules"
          fi

          jvm_modules="$(
            comm -12 \
              <(printf '%s\n' "$test_modules" | sort -u) \
              <(printf '%s\n' "$changed_modules" | sort -u)
          )"

          compile_modules="$(
            comm -23 \
              <(printf '%s\n' "$changed_modules" | sort -u) \
              <(printf '%s\n' "$test_modules" | sort -u)
          )"

          tasks=(spotlessCheck :demo:jvmTest)
          all_tasks=""

          load_all_tasks() {
            if [ -z "$all_tasks" ]; then
              all_tasks="$(./gradlew --console=plain tasks --all)"
            fi
          }

          while IFS= read -r module; do
            if [ -n "$module" ]; then
              load_all_tasks
              module_name="${module#:}"
              module_test_tasks="$(
                printf '%s\n' "$all_tasks" |
                  awk -v module="$module_name" '$0 ~ "^" module ":(jvmTest|desktopTest)( |$)" { print ":" $1 }' |
                  sort -u
              )"

              if [ -z "$module_test_tasks" ]; then
                echo "No JVM/Desktop test tasks found for $module."
                exit 1
              fi

              while IFS= read -r task; do
                tasks+=("$task")
              done <<< "$module_test_tasks"
            fi
          done <<< "$jvm_modules"

          if [ -n "$compile_modules" ]; then
            load_all_tasks
            while IFS= read -r module; do
              if [ -z "$module" ]; then
                continue
              fi
              module_name="${module#:}"
              module_tasks="$(
                printf '%s\n' "$all_tasks" |
                  awk -v module="$module_name" '$0 ~ "^" module ":compile(Kotlin(Jvm|Desktop)|DebugKotlin(Android)?)( |$)" { print ":" $1 }' |
                  sort -u
              )"

              if [ -z "$module_tasks" ]; then
                echo "No JVM/Desktop/Android Kotlin compile tasks found for $module."
                exit 1
              fi

              while IFS= read -r task; do
                tasks+=("$task")
              done <<< "$module_tasks"
            done <<< "$compile_modules"
          fi

          printf 'Running fast check tasks:\n'
          printf '  %s\n' "${tasks[@]}"
          ./gradlew --console=plain "${tasks[@]}"

  release-screenshot-tests:
    runs-on: macos-latest
    if: startsWith(github.head_ref, 'changeset-release/')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          token: ${{ github.token }}

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Screenshot Tests
        run: ./gradlew --console=plain :visual-regressions:jvmScreenshotTest

  android-tests-min-api:
    name: ${{ matrix.module }}-android-tests-min-api
    needs: [ discover-android-modules, fast-checks ]
    if: needs.discover-android-modules.result == 'success' && needs.discover-android-modules.outputs.android_modules != '[]'
    strategy:
      matrix:
        module: ${{ fromJson(needs.discover-android-modules.outputs.android_modules) }}
    uses: ./.github/workflows/android-emulator-tests.yml
    with:
      module: ${{ matrix.module }}
      test-command: ./gradlew --console=plain ${{ matrix.module }}:connectedDebugAndroidTest

  android-tests-api29:
    name: ${{ matrix.module }}-android-tests-api29
    needs: [ discover-android-modules, fast-checks ]
    if: needs.discover-android-modules.result == 'success' && needs.discover-android-modules.outputs.android_modules != '[]'
    strategy:
      matrix:
        module: ${{ fromJson(needs.discover-android-modules.outputs.android_modules) }}
    uses: ./.github/workflows/android-emulator-tests.yml
    with:
      module: ${{ matrix.module }}-api29
      emulator-profile: android-emulator-api29.properties
      test-command: >-
        ./gradlew --console=plain ${{ matrix.module }}:connectedDebugAndroidTest
        -Pandroid.testInstrumentationRunnerArguments.annotation=androidx.test.filters.SdkSuppress

  release-gate:
    name: release-gate
    if: always() && startsWith(github.head_ref, 'changeset-release/')
    needs: [ fast-checks, release-screenshot-tests, android-tests-min-api, android-tests-api29 ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify release checks
        env:
          FAST_CHECKS_RESULT: ${{ needs.fast-checks.result }}
          SCREENSHOT_TESTS_RESULT: ${{ needs.release-screenshot-tests.result }}
          ANDROID_TESTS_MIN_API_RESULT: ${{ needs.android-tests-min-api.result }}
          ANDROID_TESTS_API29_RESULT: ${{ needs.android-tests-api29.result }}
        run: |
          set -euo pipefail

          printf 'fast-checks: %s\n' "$FAST_CHECKS_RESULT"
          printf 'release-screenshot-tests: %s\n' "$SCREENSHOT_TESTS_RESULT"
          printf 'android-tests-min-api: %s\n' "$ANDROID_TESTS_MIN_API_RESULT"
          printf 'android-tests-api29: %s\n' "$ANDROID_TESTS_API29_RESULT"

          test "$FAST_CHECKS_RESULT" = success
          test "$SCREENSHOT_TESTS_RESULT" = success
          test "$ANDROID_TESTS_MIN_API_RESULT" = success
          test "$ANDROID_TESTS_API29_RESULT" = success
