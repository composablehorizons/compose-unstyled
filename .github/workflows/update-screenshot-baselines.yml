name: Update Screenshot Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch that receives the regenerated baselines
        required: true
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshot-baseline-update-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update-screenshot-baselines:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          token: ${{ github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Regenerate screenshot baselines
        run: ./gradlew --console=plain :visual-regressions:takeScreenshots

      - name: Commit screenshot baselines
        id: baseline
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BRANCH"
          git add visual-regressions/src/jvmTest/resources/screenshots
          if git diff --cached --quiet; then
            echo "Screenshot baselines are already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          update_branch="automation/update-screenshot-baselines-$GITHUB_RUN_ID"
          git switch -c "$update_branch"
          git commit -m "Update visual regression baselines"
          git push origin "$update_branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "update_branch=$update_branch" >> "$GITHUB_OUTPUT"

      - name: Open screenshot baseline pull request
        if: steps.baseline.outputs.changed == 'true'
        uses: actions/github-script@v8
        env:
          BASE_BRANCH: ${{ inputs.branch }}
          UPDATE_BRANCH: ${{ steps.baseline.outputs.update_branch }}
        with:
          script: |
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: process.env.BASE_BRANCH,
              head: process.env.UPDATE_BRANCH,
              title: 'Update visual regression baselines',
              body: [
                'Regenerated visual regression baselines from the current base branch.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
