name: Update Screenshot Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch that receives the regenerated baselines
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: screenshot-baseline-update-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update-screenshot-baselines:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          token: ${{ github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Regenerate screenshot baselines
        run: ./gradlew --console=plain :visual-regressions:takeScreenshots

      - name: Commit screenshot baselines
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BRANCH"
          git add visual-regressions/src/jvmTest/resources/screenshots
          if git diff --cached --quiet; then
            echo "Screenshot baselines are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update visual regression baselines"
          git push origin "HEAD:$BRANCH"
