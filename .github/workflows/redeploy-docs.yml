name: Redeploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'demo/**'
      - 'gradle/libs.versions.toml'
      - 'scripts/generate-compose-unstyled-api.js'
      - 'scripts/generate-demo-registry.js'
      - '.github/workflows/deploy-website.yml'
      - '.github/workflows/redeploy-docs.yml'

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-website.yml
