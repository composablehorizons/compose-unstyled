name: Nightly Checks

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  API_LEVEL: 23
  ARCH: x86_64
  DISK_SIZE: 2048M

jobs:
  jvm-and-assemble:
    env:
      ORG_GRADLE_JVMARGS: "-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          token: ${{ github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: JVM Tests and Assemble
        run: ./gradlew --console=plain spotlessCheck jvmTest :demo:jvmTest assemble

  screenshot-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          token: ${{ github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Screenshot Tests
        run: ./gradlew --console=plain :visual-regressions:jvmScreenshotTest

      - name: Upload screenshot failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-failure-artifacts
          path: visual-regressions/build/reports/screenshot-tests
          if-no-files-found: warn

  discover-android-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          token: ${{ github.token }}

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Discover Android modules
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          modules="$(
            ./gradlew --console=plain tasks --all |
              awk -F: '/^composeunstyled-[^:]+:connectedDebugAndroidTest / { print ":" $1 }' |
              sort -u
          )"

          if [ -z "$modules" ]; then
            echo "No composeunstyled-* connectedDebugAndroidTest tasks found."
            exit 1
          fi

          modules_json="$(printf '%s\n' "$modules" | jq -R . | jq -s -c .)"
          echo "modules=$modules_json" >> "$GITHUB_OUTPUT"

  android-tests:
    name: ${{ matrix.module }}-android-tests
    needs: discover-android-modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-android-modules.outputs.modules) }}
    uses: ./.github/workflows/android-emulator-tests.yml
    with:
      module: ${{ matrix.module }}
      test-command: ./gradlew --console=plain ${{ matrix.module }}:connectedDebugAndroidTest

  report-failure:
    needs: [ jvm-and-assemble, screenshot-tests, discover-android-modules, android-tests ]
    if: ${{ always() && (needs.jvm-and-assemble.result == 'failure' || needs.screenshot-tests.result == 'failure' || needs.discover-android-modules.result == 'failure' || needs.android-tests.result == 'failure') }}
    runs-on: ubuntu-latest
    concurrency:
      group: nightly-failure-reporter
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Report specific failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/report_nightly_failures.py
