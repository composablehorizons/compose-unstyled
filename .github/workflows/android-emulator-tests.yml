name: Android Emulator Tests

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref to check out before running tests. Uses the workflow ref when omitted.
        required: false
        type: string
        default: ''
      module:
        description: Module label used for the job name.
        required: true
        type: string
      test-command:
        description: Gradle command to run inside the Android emulator.
        required: true
        type: string

jobs:
  android-test:
    name: ${{ inputs.module }}-android-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Enable Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v5
        if: inputs.checkout-ref == ''

      - uses: actions/checkout@v5
        if: inputs.checkout-ref != ''
        with:
          ref: ${{ inputs.checkout-ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          token: ${{ github.token }}

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Read emulator profile
        id: emulator-profile
        shell: bash
        run: |
          set -euo pipefail

          profile="android-emulator.properties"

          property() {
            awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; found = 1 } END { exit found ? 0 : 1 }' "$profile"
          }

          hardware_profile="$(property "hardwareProfile")"
          if [ "$hardware_profile" = "none" ]; then
            hardware_profile=""
          fi

          {
            echo "avd-name=$(property "avdName")"
            echo "api-level=$(property "apiLevel")"
            echo "target=$(property "target")"
            echo "arch=$(property "arch.default")"
            echo "disk-size=$(property "diskSize")"
            echo "display-width=$(property "displayWidth")"
            echo "display-height=$(property "displayHeight")"
            echo "display-density=$(property "displayDensity")"
            echo "cores=$(property "cpuCores")"
            echo "hardware-profile=$hardware_profile"
            echo "launch-flags=$(property "launchFlags")"
          } >> "$GITHUB_OUTPUT"

      - name: Restore AVD
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ steps.emulator-profile.outputs.avd-name }}-${{ steps.emulator-profile.outputs.api-level }}-${{ steps.emulator-profile.outputs.target }}-${{ steps.emulator-profile.outputs.arch }}-${{ steps.emulator-profile.outputs.disk-size }}-${{ steps.emulator-profile.outputs.display-width }}x${{ steps.emulator-profile.outputs.display-height }}-${{ steps.emulator-profile.outputs.display-density }}-${{ steps.emulator-profile.outputs.cores }}-${{ steps.emulator-profile.outputs.hardware-profile }}

      - name: Create AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 8
        continue-on-error: true
        id: create-avd-first-attempt
        with:
          avd-name: ${{ steps.emulator-profile.outputs.avd-name }}
          api-level: ${{ steps.emulator-profile.outputs.api-level }}
          target: ${{ steps.emulator-profile.outputs.target }}
          arch: ${{ steps.emulator-profile.outputs.arch }}
          profile: ${{ steps.emulator-profile.outputs.hardware-profile }}
          cores: ${{ steps.emulator-profile.outputs.cores }}
          disk-size: ${{ steps.emulator-profile.outputs.disk-size }}
          force-avd-creation: false
          emulator-options: ${{ steps.emulator-profile.outputs.launch-flags }}
          disable-animations: false
          pre-emulator-launch-script: |
            sed -i "s/^hw.lcd.width=.*/hw.lcd.width=${{ steps.emulator-profile.outputs.display-width }}/" "$HOME/.android/avd/${{ steps.emulator-profile.outputs.avd-name }}.avd/config.ini"
            sed -i "s/^hw.lcd.height=.*/hw.lcd.height=${{ steps.emulator-profile.outputs.display-height }}/" "$HOME/.android/avd/${{ steps.emulator-profile.outputs.avd-name }}.avd/config.ini"
            sed -i "s/^hw.lcd.density=.*/hw.lcd.density=${{ steps.emulator-profile.outputs.display-density }}/" "$HOME/.android/avd/${{ steps.emulator-profile.outputs.avd-name }}.avd/config.ini"
          script: echo "Generated AVD snapshot for caching."

      - name: Create AVD retry 1
        if: steps.avd-cache.outputs.cache-hit != 'true' && steps.create-avd-first-attempt.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 8
        continue-on-error: true
        id: create-avd-second-attempt
        with:
          avd-name: ${{ steps.emulator-profile.outputs.avd-name }}
          api-level: ${{ steps.emulator-profile.outputs.api-level }}
          target: ${{ steps.emulator-profile.outputs.target }}
          arch: ${{ steps.emulator-profile.outputs.arch }}
          profile: ${{ steps.emulator-profile.outputs.hardware-profile }}
          cores: ${{ steps.emulator-profile.outputs.cores }}
          disk-size: ${{ steps.emulator-profile.outputs.disk-size }}
          force-avd-creation: false
          emulator-options: ${{ steps.emulator-profile.outputs.launch-flags }}
          disable-animations: false
          pre-emulator-launch-script: |
            sed -i "s/^hw.lcd.width=.*/hw.lcd.width=${{ steps.emulator-profile.outputs.display-width }}/" "$HOME/.android/avd/${{ steps.emulator-profile.outputs.avd-name }}.avd/config.ini"
            sed -i "s/^hw.lcd.height=.*/hw.lcd.height=${{ steps.emulator-profile.outputs.display-height }}/" "$HOME/.android/avd/${{ steps.emulator-profile.outputs.avd-name }}.avd/config.ini"
            sed -i "s/^hw.lcd.density=.*/hw.lcd.density=${{ steps.emulator-profile.outputs.display-density }}/" "$HOME/.android/avd/${{ steps.emulator-profile.outputs.avd-name }}.avd/config.ini"
          script: echo "Generated AVD snapshot for caching."

      - name: Create AVD retry 2
        if: steps.avd-cache.outputs.cache-hit != 'true' && steps.create-avd-second-attempt.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 8
        id: create-avd-third-attempt
        with:
          avd-name: ${{ steps.emulator-profile.outputs.avd-name }}
          api-level: ${{ steps.emulator-profile.outputs.api-level }}
          target: ${{ steps.emulator-profile.outputs.target }}
          arch: ${{ steps.emulator-profile.outputs.arch }}
          profile: ${{ steps.emulator-profile.outputs.hardware-profile }}
          cores: ${{ steps.emulator-profile.outputs.cores }}
          disk-size: ${{ steps.emulator-profile.outputs.disk-size }}
          force-avd-creation: false
          emulator-options: ${{ steps.emulator-profile.outputs.launch-flags }}
          disable-animations: false
          pre-emulator-launch-script: |
            sed -i "s/^hw.lcd.width=.*/hw.lcd.width=${{ steps.emulator-profile.outputs.display-width }}/" "$HOME/.android/avd/${{ steps.emulator-profile.outputs.avd-name }}.avd/config.ini"
            sed -i "s/^hw.lcd.height=.*/hw.lcd.height=${{ steps.emulator-profile.outputs.display-height }}/" "$HOME/.android/avd/${{ steps.emulator-profile.outputs.avd-name }}.avd/config.ini"
            sed -i "s/^hw.lcd.density=.*/hw.lcd.density=${{ steps.emulator-profile.outputs.display-density }}/" "$HOME/.android/avd/${{ steps.emulator-profile.outputs.avd-name }}.avd/config.ini"
          script: echo "Generated AVD snapshot for caching."

      - name: Android Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: ${{ steps.emulator-profile.outputs.avd-name }}
          api-level: ${{ steps.emulator-profile.outputs.api-level }}
          target: ${{ steps.emulator-profile.outputs.target }}
          arch: ${{ steps.emulator-profile.outputs.arch }}
          profile: ${{ steps.emulator-profile.outputs.hardware-profile }}
          cores: ${{ steps.emulator-profile.outputs.cores }}
          disk-size: ${{ steps.emulator-profile.outputs.disk-size }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ steps.emulator-profile.outputs.launch-flags }}
          disable-animations: true
          pre-emulator-launch-script: |
            sed -i "s/^hw.lcd.width=.*/hw.lcd.width=${{ steps.emulator-profile.outputs.display-width }}/" "$HOME/.android/avd/${{ steps.emulator-profile.outputs.avd-name }}.avd/config.ini"
            sed -i "s/^hw.lcd.height=.*/hw.lcd.height=${{ steps.emulator-profile.outputs.display-height }}/" "$HOME/.android/avd/${{ steps.emulator-profile.outputs.avd-name }}.avd/config.ini"
            sed -i "s/^hw.lcd.density=.*/hw.lcd.density=${{ steps.emulator-profile.outputs.display-density }}/" "$HOME/.android/avd/${{ steps.emulator-profile.outputs.avd-name }}.avd/config.ini"
          script: ${{ inputs.test-command }}
