name: Android Emulator Tests

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref to check out before running tests. Uses the workflow ref when omitted.
        required: false
        type: string
        default: ''
      module:
        description: Module label used for the job name.
        required: true
        type: string
      test-command:
        description: Gradle command to run inside the Android emulator.
        required: true
        type: string
      emulator-profile:
        description: Repository emulator profile used for this test run.
        required: false
        type: string
        default: android-emulator.properties

jobs:
  android-test:
    name: ${{ inputs.module }}-android-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EMULATOR_PROFILE: ${{ inputs.emulator-profile }}
      TEST_COMMAND: ${{ inputs.test-command }}
    steps:
      - name: Enable Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}

      - name: Preserve Android setup tooling
        run: cp .github/scripts/android_ci.py "$RUNNER_TEMP/android_ci.py"

      - uses: actions/checkout@v5
        if: inputs.checkout-ref != ''
        with:
          ref: ${{ inputs.checkout-ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          token: ${{ github.token }}

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Android SDK cache settings
        id: sdk-settings
        env:
          MODULE: ${{ inputs.module }}
        run: |
          echo "root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "artifact-name=${MODULE//:/}" >> "$GITHUB_OUTPUT"
          echo "tooling-hash=$(sha256sum "$RUNNER_TEMP/android_ci.py" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          api_level="$(sed -n 's/^apiLevel=//p' "$EMULATOR_PROFILE")"
          target="$(sed -n 's/^target=//p' "$EMULATOR_PROFILE")"
          arch="$(sed -n 's/^arch.default=//p' "$EMULATOR_PROFILE")"
          echo "platform=platforms/android-$api_level" >> "$GITHUB_OUTPUT"
          echo "system-image=system-images/android-$api_level/$target/$arch" >> "$GITHUB_OUTPUT"

      # Cache packages, not running-device snapshots. A fresh AVD avoids snapshots
      # becoming incompatible when the hosted runner's emulator version changes.
      - name: Restore Android SDK
        id: sdk-cache
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ steps.sdk-settings.outputs.root }}/build-tools/37.0.0
            ${{ steps.sdk-settings.outputs.root }}/platform-tools
            ${{ steps.sdk-settings.outputs.root }}/${{ steps.sdk-settings.outputs.platform }}
            ${{ steps.sdk-settings.outputs.root }}/${{ steps.sdk-settings.outputs.system-image }}
            ${{ steps.sdk-settings.outputs.root }}/emulator
            ${{ steps.sdk-settings.outputs.root }}/licenses
          key: android-sdk-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk-settings.outputs.image }}-${{ inputs.emulator-profile }}-${{ hashFiles(inputs.emulator-profile) }}-${{ steps.sdk-settings.outputs.tooling-hash }}

      - name: Install Android SDK
        id: sdk-install
        timeout-minutes: 15
        run: python3 -B "$RUNNER_TEMP/android_ci.py" install "$EMULATOR_PROFILE"

      - name: Prepare Android test dependencies
        timeout-minutes: 20
        run: python3 -B "$RUNNER_TEMP/android_ci.py" prepare-tests "$EMULATOR_PROFILE" "$TEST_COMMAND"

      - name: Start Android emulator
        timeout-minutes: 12
        run: python3 -B "$RUNNER_TEMP/android_ci.py" start "$EMULATOR_PROFILE"

      # Run exactly once. No setup retry can swallow a failing instrumentation test.
      - name: Android Tests
        run: ${{ inputs.test-command }}

      - name: Stop Android emulator
        if: always()
        continue-on-error: true
        run: '"$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill'

      - name: Save Android SDK
        if: always() && steps.sdk-install.outcome == 'success' && steps.sdk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ steps.sdk-settings.outputs.root }}/build-tools/37.0.0
            ${{ steps.sdk-settings.outputs.root }}/platform-tools
            ${{ steps.sdk-settings.outputs.root }}/${{ steps.sdk-settings.outputs.platform }}
            ${{ steps.sdk-settings.outputs.root }}/${{ steps.sdk-settings.outputs.system-image }}
            ${{ steps.sdk-settings.outputs.root }}/emulator
            ${{ steps.sdk-settings.outputs.root }}/licenses
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Upload Android failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-failure-${{ steps.sdk-settings.outputs.artifact-name }}
          path: |
            build/reports/android-emulator
            **/build/reports/androidTests
            **/build/outputs/androidTest-results
          if-no-files-found: ignore
