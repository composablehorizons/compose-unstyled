#Gradle
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
kotlin.code.style=official
#Compose
org.jetbrains.compose.experimental.wasm.enabled=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Preserve the existing KMP Android variants until the Android-KMP plugin migration.
android.builtInKotlin=false
android.newDsl=false
#Publishing
# These can be overridden by local.properties or environment variables
mavenCentralUsername=
mavenCentralPassword=
# Signing configuration
# The actual values should be set in local.properties or CI environment
signing.keyId=
signing.password=
signing.key=
